<!DOCTYPE html>
<html>
<head>
  <title>LaTeX Options</title>
  <style>
    body { width: 220px; font-family: sans-serif; padding: 10px; }
    .option { margin-bottom: 10px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input[type='color'] { width: 100%; height: 30px; border: 1px solid #ccc; }
  </style>
</head>
<body>
  <div class="option">
    <label for="latexBgColor">LaTeX Background Color:</label>
    <input type="color" id="latexBgColor" value="#ffffff"> <!-- Default to white -->
  </div>
  <script src="popup.js"></script>
</body>
</html>
